name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, coach-front-pressure-2.2.3, coach-ux-overhaul-2.2.4]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: openfront-replay-coach-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out only the pinned public OpenFront source
        run: git submodule update --init --depth 1 vendor/OpenFrontIO

      - name: Set up upstream Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Set up upstream npm
        run: npm install --global npm@12.1.0

      - name: Install pinned OpenFront workspaces
        working-directory: vendor/OpenFrontIO
        run: npm ci --ignore-scripts

      - name: Build original OpenFront replay workers
        run: npm run build:engine


      - name: Install Coach dependencies
        run: npm ci

      - name: Build and package
        run: npm run build && npx electron-builder --win nsis zip --publish never

      - name: Smoke-test packaged Windows renderer
        run: node scripts/smoke-test-windows.mjs

      - name: Upload installer and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront-Replay-Coach-Windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Check whether this version is already released
        id: release_version
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && steps.release_version.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.release_version.outputs.version) }}
          name: OpenFront Replay Coach ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.release_version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
