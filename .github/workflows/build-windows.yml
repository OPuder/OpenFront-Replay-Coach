name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: openfront-replay-coach-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out only the pinned public OpenFront source
        run: git submodule update --init --depth 1 vendor/OpenFrontIO

      - name: Set up upstream Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Set up upstream npm
        run: npm install --global npm@12.1.0

      - name: Install pinned OpenFront workspaces
        working-directory: vendor/OpenFrontIO
        run: npm ci --ignore-scripts

      - name: Build original OpenFront replay workers
        run: npm run build:engine


      - name: Install Coach dependencies
        run: npm ci

      - name: Build and package
        run: npm run build && npx electron-builder --win nsis zip --publish never

      - name: Smoke-test packaged Windows renderer
        run: node scripts/smoke-test-windows.mjs

      - name: Upload installer and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront-Replay-Coach-Windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.4
          name: OpenFront Replay Coach 2.1.4
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
