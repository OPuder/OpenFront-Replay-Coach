name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "engine-build/**"
      - "vendor/OpenFrontIO"
      - ".gitmodules"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out only the pinned public OpenFront source
        run: git submodule update --init --depth 1 vendor/OpenFrontIO

      - name: Set up upstream Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Set up upstream npm
        run: npm install --global npm@12.1.0

      - name: Install pinned OpenFront workspaces
        working-directory: vendor/OpenFrontIO
        run: npm ci --ignore-scripts

      - name: Build original OpenFront replay workers
        run: npm run build:engine


      - name: Install Coach dependencies
        run: npm ci

      - name: Build and package
        run: npm run build && npx electron-builder --win nsis zip --publish never

      - name: Upload installer and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront-Replay-Coach-Windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
