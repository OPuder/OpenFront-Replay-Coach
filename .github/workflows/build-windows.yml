name: Build Windows app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: openfront-replay-coach-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore exact historical engine Git objects
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up upstream Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up upstream npm
        run: npm install --global npm@12.1.0

      - name: Restore reusable historical engine bundles
        id: engine-bundle-cache
        uses: actions/cache@v4
        with:
          path: src/renderer/engine
          key: openfront-engine-bundles-v1-${{ runner.os }}-${{ hashFiles('engine-build/**', 'scripts/build-engines.mjs', '.node-version') }}

      - name: Prepare all exact historical OpenFront engines
        env:
          OPENFRONT_SKIP_ENGINE_DEPENDENCIES: ${{ steps.engine-bundle-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: npm run prepare:engines

      - name: Build exact replay engine bundles on cache miss
        if: steps.engine-bundle-cache.outputs.cache-hit != 'true'
        run: npm run build:engine
      - name: Verify every pinned replay engine bundle
        run: npm run verify:engine-bundles

      - name: Install Coach dependencies
        run: npm ci


      - name: Build and package
        run: npm run build:app && npx electron-builder --win nsis zip --publish never

      - name: Test pro coaching algorithm and phase analytics
        if: github.event_name != 'pull_request'
        run: npm run test:coach

      - name: Smoke-test packaged Windows renderer and five-minute idle stability
        timeout-minutes: 10
        run: node scripts/smoke-test-windows.mjs

      - name: Upload installer and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront-Replay-Coach-Windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14

