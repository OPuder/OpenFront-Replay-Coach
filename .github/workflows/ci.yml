name: CI — Replay Coach

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_live_replay:
        description: "Zusätzlich den vollständigen Live-Replay-/Electron-/IndexedDB-Test ausführen"
        required: false
        type: boolean
        default: false
  schedule:
    # Full live-replay/browser validation runs weekly, not on every PR.
    - cron: "41 3 * * 1"

permissions:
  contents: read

concurrency:
  # Validate the newest PR/main state; obsolete main pushes must not consume
  # runners while a newer integrated commit is being checked.
  group: replay-coach-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-replay-changes:
    name: Detect replay-sensitive changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      replay_changed: ${{ steps.filter.outputs.replay_changed }}
    steps:
      - name: Check out commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify changes that require real replay validation
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "replay_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(\.gitmodules$|engine-build/|vendor/|src/renderer/engine/|src/renderer/ReplaySimulation\\.ts|src/renderer/matchStore\.ts|src/main/decoder/|scripts/(build-engines|prepare-engines|validate-engine-pin|replay-engine|pro-coach|longitudinal|replay-territory)|src/renderer/ReplayVisualization|src/renderer/main\.tsx)' <<< "$changed"; then
            echo "replay_changed=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$changed" | grep -E '^(src/renderer/ReplaySimulation\\.ts|src/renderer/matchStore\.ts|src/main/decoder/|scripts/(replay-engine|pro-coach|longitudinal|replay-territory)|src/renderer/ReplayVisualization|src/renderer/main\.tsx)'
          else
            echo "replay_changed=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    if: github.event_name != 'schedule'
    name: Core tests, engine validation and production build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out source without recursive upstream submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore exact engine Git objects
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/**/package-lock.json

      - name: Set up repository-pinned npm
        run: npm install --global npm@12.1.0

      - name: Install Coach dependencies
        run: npm ci

      - name: Restore verified replay engine bundles
        uses: actions/cache@v4
        with:
          path: |
            src/renderer/engine
            .openfront-engine-build.json
          key: openfront-engine-bundles-${{ hashFiles('.gitmodules', 'engine-build/**', 'vendor/**/package-lock.json', 'scripts/build-engines.mjs') }}
          enableCrossOsArchive: true

      - name: Prepare exact historical OpenFront engines
        timeout-minutes: 55
        run: npm run prepare:engines


      - name: Validate exact engine pins and runtime mappings
        run: npm run validate:engine-pin

      - name: Typecheck and build production application
        run: npm run build

      # These suites use isolated test runners and independent fixtures. Run
      # them concurrently after the shared production build to shorten CI time.
      - name: Run independent regression suites in parallel
        timeout-minutes: 30
        shell: bash
        run: |
          set -Eeuo pipefail
          logs=("$RUNNER_TEMP/test-ux.log" "$RUNNER_TEMP/test-coach.log" "$RUNNER_TEMP/test-opencode.log" "$RUNNER_TEMP/test-integration.log")
          xvfb-run -a npm run test:ux-ui > "${logs[0]}" 2>&1 & ux_pid=$!
          npm run test:coach > "${logs[1]}" 2>&1 & coach_pid=$!
          npm run test:opencode-config > "${logs[2]}" 2>&1 & opencode_pid=$!
          npm run test:integration-e2e > "${logs[3]}" 2>&1 & integration_pid=$!

          status=0
          for pid in "$ux_pid" "$coach_pid" "$opencode_pid" "$integration_pid"; do
            wait "$pid" || status=1
          done

          for log in "${logs[@]}"; do
            echo "::group::$(basename "$log")"
            cat "$log"
            echo "::endgroup::"
          done
          exit "$status"

  live-replay:
    needs: detect-replay-changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.include_live_replay) || ((github.event_name == 'pull_request' || github.event_name == 'push') && needs.detect-replay-changes.outputs.replay_changed == 'true')
    name: Live replay simulation, coaching and IndexedDB regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source without recursive upstream submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore exact engine Git objects
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/**/package-lock.json

      - name: Set up repository-pinned npm
        run: npm install --global npm@12.1.0

      - name: Install Coach dependencies
        run: npm ci

      - name: Restore verified replay engine bundles
        uses: actions/cache@v4
        with:
          path: |
            src/renderer/engine
            .openfront-engine-build.json
          key: openfront-engine-bundles-${{ hashFiles('.gitmodules', 'engine-build/**', 'vendor/**/package-lock.json', 'scripts/build-engines.mjs') }}
          enableCrossOsArchive: true

      - name: Prepare exact historical OpenFront engines
        timeout-minutes: 55
        run: npm run prepare:engines


      - name: Build production renderer and replay workers
        run: npm run build

      - name: Run real replay batch through simulation, coaching, timeline and IndexedDB
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/replay-engine-batch-browser-test.mjs

      - name: Verify exact-engine replay hashes, territory, movement, cancellation and IndexedDB
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/replay-engine-browser-test.mjs
