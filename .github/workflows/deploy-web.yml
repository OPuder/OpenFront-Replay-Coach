name: Deploy Replay Coach Web App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: replay-coach-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out pinned OpenFront engine
        run: git submodule update --init --depth 1 vendor/OpenFrontIO

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.1.0

      - name: Install pinned OpenFront dependencies
        working-directory: vendor/OpenFrontIO
        run: npm ci --ignore-scripts

      - name: Install Coach dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

      - name: Validate PWA output
        run: node scripts/smoke-test-web.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
