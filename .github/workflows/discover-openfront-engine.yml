name: Discover new OpenFront engine revisions

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover-openfront-engine
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js and restore npm package cache
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/**/package-lock.json

      - name: Discover latest exact upstream engine revision
        id: discovery
        run: |
          set -Eeuo pipefail
          before="$(git rev-parse HEAD)"
          node scripts/discover-openfront-engine.mjs
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "before=$before" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore exact historical engine Git objects
        if: steps.discovery.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up pinned npm
        if: steps.discovery.outputs.changed == 'true'
        run: npm install --global npm@12.1.0

      - name: Prepare every exact replay engine revision
        if: steps.discovery.outputs.changed == 'true'
        timeout-minutes: 55
        run: npm run prepare:engines

      - name: Restore verified replay engine bundles
        uses: actions/cache@v4
        with:
          path: |
            src/renderer/engine
            .openfront-engine-build.json
          key: openfront-engine-bundles-${{ hashFiles('.gitmodules', 'engine-build/**', 'vendor/**/package-lock.json', 'scripts/build-engines.mjs') }}
          enableCrossOsArchive: true


      - name: Install Coach dependencies
        if: steps.discovery.outputs.changed == 'true'
        run: npm ci

      - name: Verify every source pin
        if: steps.discovery.outputs.changed == 'true'
        run: npm run validate:engine-pin

      - name: Build all replay engine workers
        if: steps.discovery.outputs.changed == 'true'
        run: npm run build:engine

      - name: Run coach and existing real-replay regressions
        if: steps.discovery.outputs.changed == 'true'
        run: npm run test:coach

      - name: Publish validated engine candidate branch
        if: steps.discovery.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          bundle_id="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const engines = JSON.parse(readFileSync("engine-build/engines.json", "utf8")); console.log(engines.at(-1).bundleId);')"
          branch="automation/openfront-engine-${bundle_id}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Bundled upstream engine JS is generated from pinned source and may retain upstream whitespace.
          # Keep whitespace validation strict for repository-owned changes, but exclude only these generated bundles.
          git diff --cached --check -- . ':!src/renderer/engine/replay-engine-*.js'
          if git diff --cached --quiet; then
            echo "::error::Engine discovery reported changes but produced no commit."
            exit 1
          fi
          git commit -m "build(engine): add latest exact OpenFront revision"
          git push origin "HEAD:refs/heads/${branch}"
          echo "::notice::Validated engine candidate published on ${branch}. It still requires a review PR and real replay hash verification.";
