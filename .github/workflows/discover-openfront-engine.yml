name: Discover new OpenFront engine revisions

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover-openfront-engine
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js and restore npm package cache
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/**/package-lock.json

      - name: Discover latest exact upstream engine revision
        id: discovery
        run: |
          set -Eeuo pipefail
          before="$(git rev-parse HEAD)"
          node scripts/discover-openfront-engine.mjs
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "before=$before" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore exact historical engine Git objects
        if: steps.discovery.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up pinned npm
        if: steps.discovery.outputs.changed == 'true'
        run: npm install --global npm@12.1.0

      - name: Restore verified replay engine bundles
        uses: actions/cache@v4
        with:
          path: |
            src/renderer/engine
            .openfront-engine-build.json
          key: openfront-engine-bundles-${{ hashFiles('.gitmodules', 'engine-build/**', 'vendor/**/package-lock.json', 'scripts/build-engines.mjs', 'scripts/engine-bundle-cache.mjs') }}
          enableCrossOsArchive: true

      - name: Prepare every exact replay engine revision
        if: steps.discovery.outputs.changed == 'true'
        timeout-minutes: 55
        run: npm run prepare:engines


      - name: Install Coach dependencies
        if: steps.discovery.outputs.changed == 'true'
        run: npm ci

      - name: Verify every source pin
        if: steps.discovery.outputs.changed == 'true'
        run: npm run validate:engine-pin

      - name: Build all replay engine workers
        if: steps.discovery.outputs.changed == 'true'
        run: npm run build:engine

      - name: Run coach and existing real-replay regressions
        if: steps.discovery.outputs.changed == 'true'
        run: npm run test:coach

      - name: Publish validated engine candidate branch
        if: steps.discovery.outputs.changed == 'true'
        run: bash scripts/publish-engine-candidate-branch.sh
