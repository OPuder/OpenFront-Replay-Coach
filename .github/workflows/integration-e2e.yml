name: Integration E2E contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/INTEGRATION_E2E.md"
      - "scripts/integration-e2e-contract.test.mjs"
      - "scripts/replay-engine-test.ts"
      - "scripts/replay-engine-batch-browser-test.mjs"
      - "scripts/pro-coach-algorithm.test.mjs"
      - "scripts/longitudinal-coach.test.mjs"
      - "scripts/test-android-in-place-update.sh"
      - "scripts/test-android-release-upgrade.sh"
      - "scripts/download-android-release-baseline.sh"
      - "scripts/verify-android-release-signing.sh"
      - ".github/workflows/update-validation.yml"
      - "package.json"
      - "src/**"
      - ".github/workflows/integration-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-contracts:
    runs-on: ubuntu-latest
    steps:
      # Initialize only the top-level OpenFront engine submodules through
      # prepare:engines. Recursive checkout follows OpenFrontIO's unrelated
      # server/gatekeeper submodule, whose upstream URL is no longer available.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # Historical OpenFront lockfiles explicitly require npm >=12.1 <13.
      # Node 24.15.0 alone ships npm 11 on the hosted runner.
      - name: Set up pinned npm
        run: npm install --global npm@12.1.0
      - name: Verify pinned Node and npm toolchain
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) throw new Error('Expected Node 24');"
          npm exec --yes --package=npm@12.1.0 -- npm --version
      - run: npm ci
      - name: Prepare exact historical replay engines
        run: npm run prepare:engines
      - name: Validate pinned engine catalog
        run: npm run validate:engine-pin
      - name: Typecheck and production build
        run: npm run build
      - name: Run production-module integration unit contracts
        run: npm run test:integration-e2e
      - name: Run replay, coaching, storage, and updater regression suites
        run: npm run test:coach
      - name: Run real Europe and Levant replay → simulation → coaching → timeline → IndexedDB flow
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/replay-engine-batch-browser-test.mjs
