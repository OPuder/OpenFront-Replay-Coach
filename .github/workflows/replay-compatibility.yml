name: Replay compatibility regression gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Validate all GitHub Actions workflow files
        uses: raven-actions/actionlint@v2.2.0
        with:
          version: "1.7.12"
          files: ".github/workflows/*.yml"
          shellcheck: false
          pyflakes: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@12.1.0

      - name: Install Coach dependencies
        run: npm ci

      - name: Restore reusable historical engine bundles
        id: engine-bundle-cache
        uses: actions/cache@v6
        with:
          path: src/renderer/engine
          key: openfront-engine-bundles-v1-${{ runner.os }}-${{ hashFiles('engine-build/**', 'scripts/build-engines.mjs', '.node-version') }}

      - name: Prepare exact historical OpenFront engines on cache miss
        if: steps.engine-bundle-cache.outputs.cache-hit != 'true'
        run: npm run prepare:engines 2>&1 | tee historical-engine-prepare.log

      - name: Build exact replay engine bundles on cache miss
        if: steps.engine-bundle-cache.outputs.cache-hit != 'true'
        run: npm run build:engine 2>&1 | tee replay-engine-build.log
      - name: Verify every pinned replay engine bundle
        run: npm run verify:engine-bundles


      - name: Verify the actual Europe replay and all coaching regressions
        env:
          OPENFRONT_REPLAY_ID: c2R2JHZgUi
          OPENFRONT_REPLAY_EXPECTED_COMMIT: 8b5d071eed95f07c701b32e4c64e95b03f8577c1
          OPENFRONT_REPLAY_EXPECTED_MAP: Europe
          OPENFRONT_REPLAY_EXPECTED_PLAYERS: "2"
          OPENFRONT_REPLAY_EXPECTED_TURNS: "1334"
          OPENFRONT_REPLAY_EXPECTED_HASHES: "1006"
        run: npm run test:coach 2>&1 | tee coach-regression-tests.log

      - name: Verify the actual Levant replay metadata
        env:
          OPENFRONT_REPLAY_ID: dLNCLHCvMK
          OPENFRONT_REPLAY_EXPECTED_COMMIT: bc3e3334c573c4959ec6a6745df6826d07233b4d
          OPENFRONT_REPLAY_EXPECTED_MAP: Levant
        run: node --import tsx --test scripts/public-replay-compatibility.test.mjs 2>&1 | tee public-replay-tests.log


      - name: Upload replay validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            historical-engine-prepare.log
            replay-engine-build.log
            coach-regression-tests.log
            public-replay-tests.log
          if-no-files-found: ignore
          retention-days: 14
