name: Replay compatibility regression gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the exact public OpenFront engine
        run: git submodule update --init --depth 1 vendor/OpenFrontIO vendor/OpenFrontIO-8b5d071eed95

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install Coach dependencies
        run: npm ci

      - name: Install pinned OpenFront engine workspaces
        working-directory: vendor/OpenFrontIO
        run: npm ci --ignore-scripts

      - name: Install historical Europe engine workspaces
        working-directory: vendor/OpenFrontIO-8b5d071eed95
        run: npm ci --ignore-scripts

      - name: Build all exact replay engine worker bundles
        run: npm run build:engine

      - name: Verify source pin and engine checkout cannot drift
        run: npm run validate:engine-pin

      - name: Verify the actual Europe replay and all coaching regressions
        env:
          OPENFRONT_REPLAY_ID: c2R2JHZgUi
        run: npm run test:coach

      - name: Run the Europe replay through its exact original engine and verify all hashes
        env:
          OPENFRONT_REPLAY_ID: c2R2JHZgUi
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox scripts/replay-engine-browser-test.mjs
