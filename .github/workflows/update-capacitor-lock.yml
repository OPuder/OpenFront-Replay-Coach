name: Update package lock for Android runtime

on:
  push:
    branches: [release-automation-2.2.4]
    paths:
      - "package.json"
      - ".github/workflows/update-capacitor-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openfront-replay-coach-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Generate the reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit the updated lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync Capacitor Android dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
