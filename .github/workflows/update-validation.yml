name: Update system validation

on:
  pull_request:
  push:
    branches: [main, feature/release-update-system]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  updater-contract-and-build:
    name: Updater contracts, typecheck and Windows packaging
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore exact historical engine Git objects
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up the repository-pinned npm version
        run: npm install --global npm@12.1.0

      - name: Prepare all exact historical OpenFront engines
        run: npm run prepare:engines

      - name: Install Coach dependencies once
        run: npm ci

      - name: Verify updater contract tests and syntax
        run: node --check scripts/verify-windows-in-place-updates.mjs && node --check scripts/windows-webview-storage.mjs && node --check scripts/android-webview-storage.mjs && node --check scripts/windows-upgrade-fixture.mjs && node --check scripts/windows-upgrade-storage-contract.mjs && node --test scripts/updater-contract.test.mjs scripts/windows-upgrade-storage-contract.test.mjs scripts/android-webview-target.test.mjs && node --import ./vendor/OpenFrontIO/node_modules/tsx/dist/loader.mjs --test scripts/update-preferences.test.mjs

      - name: Run full coaching and replay regression suite
        run: npm run test:coach

      - name: Build Windows application
        run: npm run build

      - name: Package Windows installer and portable edition
        run: npx electron-builder --win nsis zip --publish never

      - name: Stage only the installer and portable distributables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem release -File -Filter '*.exe')
          $portable = @(Get-ChildItem release -File -Filter '*.zip')
          if ($installers.Count -ne 1 -or $portable.Count -ne 1) { throw "Expected exactly one installer and one portable ZIP; found $($installers.Count) EXE and $($portable.Count) ZIP." }
          $staging = Join-Path (Resolve-Path release).Path 'packages'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item $installers[0].FullName $staging
          Copy-Item $portable[0].FullName $staging

      - name: Install and smoke-test Windows installer and portable edition
        timeout-minutes: 30
        env:
          OFRC_IDLE_SOAK_MS: "300000"
          RELEASE_DIR: release/packages
        run: node scripts/verify-windows-distributions.mjs

      - name: Download published v2.2.51 NSIS installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previous = Join-Path $env:RUNNER_TEMP 'previous-windows-release'
          New-Item -ItemType Directory -Path $previous -Force | Out-Null
          gh release download v2.2.51 --repo $env:GITHUB_REPOSITORY --pattern 'OpenFront.Replay.Coach.Setup.2.2.51.exe' --dir $previous
          if (-not (Test-Path (Join-Path $previous 'OpenFront.Replay.Coach.Setup.2.2.51.exe'))) { throw 'Published v2.2.51 installer missing.' }

      - name: Build updater-enabled portable baseline for the real updater regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateVersion = node -p "require('./package.json').version"
          $candidatePackages = Join-Path $env:RUNNER_TEMP 'candidate-release-packages'
          $releasePackages = Join-Path (Resolve-Path release).Path 'packages'
          if (-not (Test-Path -LiteralPath $releasePackages)) { throw 'Candidate Windows packages are missing before portable updater baseline build.' }
          New-Item -ItemType Directory -Path $candidatePackages -Force | Out-Null
          Copy-Item -Path (Join-Path $releasePackages '*') -Destination $candidatePackages -Recurse -Force
          try {
            node scripts/set-release-version.mjs 2.2.51
            npm run build
            npx electron-builder --win zip --publish never
            $baseline = Join-Path $env:RUNNER_TEMP 'portable-updater-baseline.zip'
            $built = Join-Path (Resolve-Path release).Path 'OpenFront Replay Coach-2.2.51-win.zip'
            if (-not (Test-Path -LiteralPath $built)) { throw 'Updater-enabled portable baseline package was not created.' }
            Copy-Item -LiteralPath $built -Destination $baseline -Force
            if ((Get-Item -LiteralPath $baseline).Length -lt 1000000) { throw 'Updater-enabled portable baseline package is implausibly small.' }
          } finally {
            node scripts/set-release-version.mjs $candidateVersion
            if (Test-Path -LiteralPath $releasePackages) { Remove-Item -LiteralPath $releasePackages -Recurse -Force }
            New-Item -ItemType Directory -Path $releasePackages -Force | Out-Null
            Copy-Item -Path (Join-Path $candidatePackages '*') -Destination $releasePackages -Recurse -Force
          }

      - name: Test Windows in-place upgrades and user data retention
        timeout-minutes: 35
        env:
          PREVIOUS_RELEASE_DIR: ${{ runner.temp }}\previous-windows-release
          CURRENT_RELEASE_DIR: release/packages
          PORTABLE_UPDATE_BASELINE: ${{ runner.temp }}\portable-updater-baseline.zip
          OFRC_UPGRADE_DIAGNOSTICS: '1'
        run: node scripts/verify-windows-in-place-updates.mjs

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: updater-validation-windows
          path: |
            release/packages/*.exe
            release/packages/*.zip
          if-no-files-found: error
          retention-days: 7

  android-apk-validation:
    name: Android APK parse, identity, version and signature validation
    outputs:
      release_apk_ready: ${{ steps.release_apk.outputs.ready }}
    # Keep emulator integration tests on the stable LTS runner; ubuntu-latest
    # moved to 26.04 and the Android 34 emulator repeatedly went offline there.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore exact historical engine Git objects
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up the repository-pinned npm version
        run: npm install --global npm@12.1.0

      - name: Prepare all exact historical OpenFront engines
        run: npm run prepare:engines

      - name: Install Coach dependencies once
        run: npm ci

      - name: Verify updater contract tests
        run: node --test scripts/updater-contract.test.mjs

      - name: Validate Android upgrade and signing shell scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/test-android-release-upgrade.sh
          bash -n scripts/test-android-in-place-update.sh
          bash -n scripts/build-android-seed-apk.sh
          bash -n scripts/verify-android-release-signing.sh
          node --check scripts/install-android-updater-plugin.mjs
          node --test scripts/set-android-version.test.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build renderer
        run: npm run build:web

      - name: Generate Android project and updater plugin
        run: |
          npx cap add android
          npx cap sync android
          node scripts/install-android-updater-plugin.mjs
          npx capacitor-assets generate --android --iconBackgroundColor "#0b1320" --splashBackgroundColor "#0b1320"

      - name: Set Android version from package.json
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/set-android-version.mjs "$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build debug APK for package validation
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Parse and validate APK metadata
        id: parse_apk
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='de.openfront.replaycoach'" /tmp/apk-badging.txt
          grep -F "versionName='"$(node -p "require('./package.json').version")"'" /tmp/apk-badging.txt
          sha256sum "$APK"

      - name: Verify permanent Android release signing key and continuity
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-android-release-signing.sh

      - name: Preserve the permanently signed APK outside the generated Android project
        id: release_apk
        if: steps.parse_apk.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          signed_apk="$RUNNER_TEMP/openfront-coach-permanent-key-release.apk"
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$signed_apk"
          echo "CURRENT_RELEASE_APK=$signed_apk" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./package.json').version")"
          mkdir -p release
          cp "$signed_apk" "release/OpenFront-Replay-Coach-$version-Android.apk"
          test -s "release/OpenFront-Replay-Coach-$version-Android.apk"

      - name: Upload signed APK before emulator regression
        if: steps.release_apk.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-validation-android
          path: release/*-Android.apk
          if-no-files-found: error
          retention-days: 7


      - name: Recreate an unsigned Android project for isolated debug upgrade tests
        if: steps.parse_apk.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          baseline="$RUNNER_TEMP/openfront-coach-before-update.apk"
          updated="$RUNNER_TEMP/openfront-coach-update.apk"
          test -s "$apk"
          cp "$apk" "$baseline"
          # Never edit or strip the release signing configuration. Discard the
          # generated project and create a fresh, default unsigned debug project.
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/install-android-updater-plugin.mjs
          current_version="$(node -p "require('./package.json').version")"
          IFS='.' read -r major minor patch <<< "$current_version"
          next_version="$major.$minor.$((patch + 1))"
          node scripts/set-android-version.mjs "$next_version"
          (cd android && timeout 600s ./gradlew --no-daemon assembleDebug)
          test -s "$apk"
          cp "$apk" "$updated"
          cp "$baseline" "$apk"
          test -s "$updated"
          seed="$RUNNER_TEMP/openfront-coach-seed.apk"
          bash scripts/build-android-seed-apk.sh "$seed" "$baseline"
          echo "OPENFRONT_UPDATE_APK=$updated" >> "$GITHUB_ENV"
          echo "OPENFRONT_SEED_APK=$seed" >> "$GITHUB_ENV"

      - name: Preinstall Android 34 emulator image with transient-download retries
        if: steps.parse_apk.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          image="system-images;android-34;google_apis;x86_64"
          image_dir="$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
          installed=false
          for attempt in 1 2 3; do
            if sdkmanager --install "$image" --channel=0 && test -s "$image_dir/source.properties"; then
              installed=true
              break
            fi
            echo "Android emulator image download/verification failed (attempt $attempt/3); clearing only the incomplete image and SDK download cache."
            rm -rf "$image_dir" "$ANDROID_HOME/temp" "$HOME/.android/cache"
            sleep "$((attempt * 10))"
          done
          [[ "$installed" == true ]] || { echo "Android 34 Google APIs x86_64 image could not be installed after three verified attempts."; exit 1; }
          test -s "$image_dir/source.properties"
          echo "Verified Android emulator image: $image_dir"

      - name: Test debug data preservation and real published-APK update
        if: steps.parse_apk.outcome == 'success'
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-audio -no-boot-anim -no-metrics -no-snapshot -gpu swiftshader -memory 4096 -partition-size 4096
          disable-animations: true
          script: bash scripts/test-android-in-place-update.sh

  release-artifact-download-audit:
    name: Download and verify release manifest and SHA-256 files
    needs: [updater-contract-and-build, android-apk-validation]
    if: always() && needs.updater-contract-and-build.result == 'success' && needs.android-apk-validation.outputs.release_apk_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verifier
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Download Windows installer and portable ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: updater-validation-windows
          path: release

      - name: Download permanently signed Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: updater-validation-android
          path: release

      - name: Generate and verify manifest/checksums from downloaded artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          export RELEASE_VERSION="$(node -p "require('./package.json').version")"
          export RELEASE_DIR=release
          node scripts/verify-release-artifacts.mjs generate

      - name: Upload audited release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-integrity-audit
          path: |
            release/*.exe
            release/*.zip
            release/*-Android.apk
            release/SHA256SUMS.txt
            release/release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Download the audited bundle again
        uses: actions/download-artifact@v4
        with:
          name: release-integrity-audit
          path: release-roundtrip

      - name: Re-verify downloaded manifest and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          export RELEASE_VERSION="$(node -p "require('./package.json').version")"
          export RELEASE_DIR=release-roundtrip
          node scripts/verify-release-artifacts.mjs verify
