name: Update system validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updater-contract-and-build:
    name: Updater contracts, typecheck and Windows packaging
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore exact historical engine Git objects
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up the repository-pinned npm version
        run: npm install --global npm@12.1.0

      - name: Prepare all exact historical OpenFront engines
        run: npm run prepare:engines

      - name: Install Coach dependencies once
        run: npm ci

      - name: Verify updater contract tests
        run: node --test scripts/updater-contract.test.mjs

      - name: Download hash-pinned Europe and Levant fixtures for decoder regression tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';

          const fixtures = [
            { id: 'c2R2JHZgUi', map: 'Europe', commit: '8b5d071eed95f07c701b32e4c64e95b03f8577c1' },
            { id: 'dLNCLHCvMK', map: 'Levant', commit: 'bc3e3334c573c4959ec6a6745df6826d07233b4d' },
          ];
          const directory = join(tmpdir(), 'openfront-replay-decoder-fixtures');
          mkdirSync(directory, { recursive: true });
          for (const fixture of fixtures) {
            const response = await fetch('https://api.openfront.io/public/game/' + encodeURIComponent(fixture.id), {
              headers: { Accept: 'application/json', 'User-Agent': 'OpenFront-Replay-Coach-CI/1.0' },
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(fixture.map + ' replay fixture download failed: HTTP ' + response.status);
            const payload = await response.json();
            const record = payload?.game ?? payload?.data?.game ?? payload?.data ?? payload;
            if (record?.gitCommit !== fixture.commit) throw new Error(fixture.map + ' replay engine commit changed');
            if (record?.info?.config?.gameMap !== fixture.map) throw new Error(fixture.map + ' replay map identity changed');
            if (!Array.isArray(record?.turns) || record.turns.length === 0) throw new Error(fixture.map + ' replay has no turn records');
            writeFileSync(join(directory, fixture.id + '.json'), JSON.stringify(record));
            console.log('Prepared decoder fixture ' + fixture.map + ': ' + record.turns.length + ' turns');
          }
          appendFileSync(process.env.GITHUB_ENV, 'OPENFRONT_REPLAY_FIXTURE_DIR=' + directory + '\n');
          NODE

      - name: Run full coaching and replay regression suite
        run: npm run test:coach

      - name: Build Windows application
        run: npm run build

      - name: Package Windows installer and portable edition
        run: npx electron-builder --win nsis zip --publish never

      - name: Verify Windows release packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release -Filter '*.exe' -File | Select-Object -First 1
          $portable = Get-ChildItem release -Filter '*.zip' -File | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1MB) { throw 'Windows installer missing or implausibly small.' }
          if (-not $portable -or $portable.Length -lt 1MB) { throw 'Windows portable ZIP missing or implausibly small.' }
          $archive = Join-Path $env:TEMP 'ofrc-portable-validation'
          Expand-Archive -LiteralPath $portable.FullName -DestinationPath $archive -Force
          $appAsar = Get-ChildItem $archive -Filter 'app.asar' -File -Recurse | Select-Object -First 1
          if (-not $appAsar -or $appAsar.Length -lt 1KB) { throw 'Portable ZIP does not contain a valid packaged app.asar.' }
          Write-Host "Installer: $($installer.Name) ($($installer.Length) bytes)"
          Write-Host "Portable: $($portable.Name) ($($portable.Length) bytes)"
          Write-Host "Packaged app.asar: $($appAsar.Length) bytes"

      - name: Exercise real Windows Installer and Portable rollback after file mutations
        shell: pwsh
        timeout-minutes: 20
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' -File | Select-Object -First 1
          $portable = Get-ChildItem release -Filter '*.zip' -File | Select-Object -First 1
          if (-not $installer -or -not $portable) { throw 'Rollback test packages are missing.' }
          ./scripts/test-windows-update-rollback.ps1 -Installer $installer.FullName -PortableZip $portable.FullName -Helper (Resolve-Path scripts/windows-update-rollback.ps1).Path

      - name: Upload Windows rollback logs and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rollback-runtime-evidence
          path: ${{ runner.temp }}/ofrc-rollback-*/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Launch packaged Windows app and verify renderer
        run: node scripts/smoke-test-windows.mjs

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: updater-validation-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  android-apk-validation:
    name: Android APK parse, identity, version and signature validation
    # Keep emulator integration tests on the stable LTS runner; ubuntu-latest
    # moved to 26.04 and the Android 34 emulator repeatedly went offline there.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore exact historical engine Git objects
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up the repository-pinned npm version
        run: npm install --global npm@12.1.0

      - name: Prepare all exact historical OpenFront engines
        run: npm run prepare:engines

      - name: Install Coach dependencies once
        run: npm ci

      - name: Verify updater contract tests
        run: node --test scripts/updater-contract.test.mjs

      - name: Validate signed Android release-upgrade script syntax
        run: bash -n scripts/test-android-release-upgrade.sh
      - name: Validate Android signature-mismatch test syntax
        run: bash -n scripts/test-android-signature-mismatch.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Download and verify the published v2.2.51 Android baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline="$RUNNER_TEMP/OpenFront-Replay-Coach-2.2.51-Android.apk"
          curl --fail --location --retry 3 --output "$baseline" "https://github.com/OPuder/OpenFront-Replay-Coach/releases/download/v2.2.51/OpenFront-Replay-Coach-2.2.51-Android.apk"
          echo "8b2da877f5e4788c29e13f7788aaca34d07e969e1f03a0f1aff8e0cdc6c030fd  $baseline" | sha256sum --check
          echo "BASELINE_APK=$baseline" >> "$GITHUB_ENV"
          echo "CANDIDATE_APK=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Build renderer
        run: npm run build:web

      - name: Generate Android project and updater plugin
        run: |
          npx cap add android
          npx cap sync android
          node scripts/install-android-updater-plugin.mjs

      - name: Set Android version from package.json
        run: node scripts/set-android-version.mjs "$(node -p 'require("./package.json").version')"

      - name: Build debug APK for package validation
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Parse and validate APK metadata
        id: parse_apk
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='de.openfront.replaycoach'" /tmp/apk-badging.txt
          grep -F "versionName='"$(node -p "require('./package.json').version")"'" /tmp/apk-badging.txt
          sha256sum "$APK"

      - name: Build higher-version APK before emulator startup
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          baseline="$RUNNER_TEMP/openfront-coach-before-update.apk"
          updated="$RUNNER_TEMP/openfront-coach-update.apk"
          test -s "$apk"
          cp "$apk" "$baseline"
          current_version="$(node -p "require('./package.json').version")"
          IFS='.' read -r major minor patch <<< "$current_version"
          next_version="$major.$minor.$((patch + 1))"
          node scripts/set-android-version.mjs "$next_version"
          (cd android && timeout 600s ./gradlew --no-daemon assembleDebug)
          test -s "$apk"
          cp "$apk" "$updated"
          cp "$baseline" "$apk"
          test -s "$updated"
          echo "OPENFRONT_UPDATE_APK=$updated" >> "$GITHUB_ENV"

      - name: Test in-place Android update and preserve app data
        if: always() && steps.parse_apk.outcome == 'success'
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-boot-timeout: 1800
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 3072 -partition-size 4096
          disable-animations: true
          script: bash scripts/test-android-in-place-update.sh && bash scripts/test-android-signature-mismatch.sh
          env:
            BASELINE_APK: ${{ env.BASELINE_APK }}
            CANDIDATE_APK: ${{ env.CANDIDATE_APK }}

      - name: Verify permanent Android release signing key and continuity
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-android-release-signing.sh

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: updater-validation-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
