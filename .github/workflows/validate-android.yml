name: Validate Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [release-automation-2.2.4, chore/verify-permanent-android-signing, fix/android-keystore-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfront-replay-coach-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    # The full signed APK and published-APK upgrade validation runs once in update-validation.yml for PRs.
    # Keep this standalone APK build for manual dispatch and explicit release-branch pushes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up pinned npm
        run: npm install --global npm@12.1.0

      - name: Restore reusable historical engine bundles
        id: engine-bundle-cache
        uses: actions/cache@v6
        with:
          path: src/renderer/engine
          key: openfront-engine-bundles-v1-${{ runner.os }}-${{ hashFiles('engine-build/**', 'scripts/build-engines.mjs', '.node-version') }}

      - name: Prepare exact historical OpenFront engines on cache miss
        if: steps.engine-bundle-cache.outputs.cache-hit != 'true'
        run: npm run prepare:engines

      - name: Build exact replay engine bundles on cache miss
        if: steps.engine-bundle-cache.outputs.cache-hit != 'true'
        run: npm run build:engine
      - name: Verify every pinned replay engine bundle
        run: npm run verify:engine-bundles

      - name: Install Coach and Capacitor dependencies
        run: npm ci

      - name: Build the shared renderer
        run: npm run build:web:app

      - name: Test pro coaching algorithm and phase analytics
        if: github.event_name != 'pull_request'
        run: npm run test:coach

      - name: Smoke-test native Android configuration
        run: node scripts/smoke-test-android-config.mjs

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Add Android build tools to PATH
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/install-android-updater-plugin.mjs

      - name: Generate branded Android launcher and splash assets
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0b1320" --splashBackgroundColor "#0b1320"

      - name: Set Android application version
        run: node scripts/set-android-version.mjs "$(node -p "require('./package.json').version")"

      - name: Validate permanent keystore credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/verify-android-keystore.mjs

      - name: Build APK with permanent signing when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            keystore="$RUNNER_TEMP/openfront-replay-coach-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            test -s "$keystore"
            export ANDROID_KEYSTORE_PATH="$keystore"
            node scripts/configure-android-signing.mjs
            (cd android && ./gradlew --no-daemon assembleRelease)
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_SIGNING_MODE=permanent" >> "$GITHUB_ENV"
          else
            (cd android && ./gradlew --no-daemon assembleDebug)
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_SIGNING_MODE=debug" >> "$GITHUB_ENV"
          fi

      - name: Verify APK signature, package ID and version
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" | tee /tmp/apk-badging.txt
          grep -F "package: name='de.openfront.replaycoach'" /tmp/apk-badging.txt
          grep -F "versionName='$version'" /tmp/apk-badging.txt
          echo "Verified APK signing mode: $APK_SIGNING_MODE"

      - name: Upload validated Android APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenFront-Replay-Coach-Android-Validated
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
