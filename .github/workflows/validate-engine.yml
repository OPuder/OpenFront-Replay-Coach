name: Validate pinned OpenFront engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitmodules"
      - "vendor/**"
      - "engine-build/**"
      - "package.json"
      - ".github/workflows/validate-engine.yml"
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "vendor/**"
      - ".github/workflows/validate-engine.yml"

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out coach source
        uses: actions/checkout@v4

      - name: Set up upstream Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Set up upstream npm
        run: npm install --global npm@12.1.0

      - name: Prepare all exact historical OpenFront engines
        run: npm run prepare:engines

      - name: Type-check all exact replay engine revisions
        run: npm run typecheck:engines

      - name: Bundle all exact replay engine workers for Electron
        run: npm run build:engine
