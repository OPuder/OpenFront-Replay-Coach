name: Validate pinned OpenFront engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitmodules"
      - "vendor/**"
      - "engine-build/**"
      - "scripts/prepare-engines.mjs"
      - "scripts/build-engines.mjs"
      - "scripts/verify-engine-bundles.mjs"
      - "package-lock.json"
      - ".node-version"
      - "package.json"
      - "scripts/updater-contract.test.mjs"
      - "scripts/android-emulator-diagnostics.sh"
      - "scripts/seed-android-baseline-ui.sh"
      - "scripts/test-android-release-upgrade.sh"
      - "scripts/inspect-android-upgrade-data.mjs"
      - "scripts/api-turn-decoder.test.mjs"
      - "src/main/decoder/ApiTurnDecoder.ts"
      - "src/renderer/androidUpgradeTestBridge.ts"
      # PR #148 adds Android updater contract coverage; keep this gate in its six-workflow acceptance set.
      - ".github/workflows/validate-engine.yml"
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "vendor/**"
      - ".github/workflows/validate-engine.yml"

permissions:
  contents: read

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out coach source
        uses: actions/checkout@v7

      - name: Restore exact historical engine Git objects
        uses: actions/cache@v6
        with:
          path: .git/modules
          key: openfront-engine-git-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.gitmodules', 'engine-build/engines.json') }}
          restore-keys: |
            openfront-engine-git-${{ runner.os }}-

      - name: Set up upstream Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up upstream npm
        run: npm install --global npm@12.1.0

      - name: Prepare all exact historical OpenFront engines
        env:
          OPENFRONT_SKIP_ENGINE_DEPENDENCIES: "1"
        run: npm run prepare:engines

      - name: Verify all engine pins and runtime mappings
        run: npm run validate:engine-pin
