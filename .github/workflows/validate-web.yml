name: Validate Web and PWA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, coach-ux-overhaul-2.2.4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfront-replay-coach-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out pinned OpenFront engine
        run: git submodule update --init --depth 1 vendor/OpenFrontIO

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.1.0

      - name: Install pinned OpenFront dependencies
        working-directory: vendor/OpenFrontIO
        run: npm ci --ignore-scripts

      - name: Install Coach dependencies
        run: npm ci

      - name: Build browser application and replay workers
        run: npm run build:web

      - name: Smoke-test PWA output
        run: node scripts/smoke-test-web.mjs

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: OpenFront-Replay-Coach-Web
          path: dist/
          if-no-files-found: error
          retention-days: 14
