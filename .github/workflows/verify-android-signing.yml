name: Verify permanent Android release signing

on:
  push:
    branches:
      - chore/verify-permanent-android-signing
    paths:
      - ".github/workflows/verify-android-signing.yml"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/configure-android-signing.mjs"
      - "scripts/set-android-version.mjs"
      - "scripts/build-engines.mjs"
      - "engine-build/**"
      - "src/**"
      - "vendor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-android-signing
  cancel-in-progress: true

jobs:
  verify-signed-apk:
    name: Build and verify APK with permanent project key
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and pinned engine sources
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out exact OpenFront engine revisions
        run: git submodule update --init --depth 1 vendor/OpenFrontIO vendor/OpenFrontIO-8b5d071eed95
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Set up pinned npm
        run: npm install --global npm@12.1.0
      - name: Install pinned upstream dependencies
        working-directory: vendor/OpenFrontIO
        run: npm ci --ignore-scripts
      - name: Install historical engine dependencies
        working-directory: vendor/OpenFrontIO-8b5d071eed95
        run: npm ci --ignore-scripts
      - name: Install Coach dependencies
        run: npm ci
      - name: Build renderer and replay engines
        run: npm run build:web
      - name: Validate native Android configuration
        run: node scripts/smoke-test-android-config.mjs
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Add Android build tools to PATH
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Require all permanent signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "All four required signing secrets are available (values not displayed)."
      - name: Generate native Android project and branded assets
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android --iconBackgroundColor "#0b1320" --splashBackgroundColor "#0b1320"
      - name: Set Android version
        env:
          RELEASE_VERSION: ${{ fromJSON('"' + github.event.repository.default_branch + '"') }}
        run: node scripts/set-android-version.mjs "$(node -p "require('./package.json').version")"
      - name: Configure permanent signing and build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          keystore="$RUNNER_TEMP/openfront-replay-coach-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          export ANDROID_KEYSTORE_PATH="$keystore"
          node scripts/configure-android-signing.mjs
          (cd android && ./gradlew --no-daemon assembleRelease)
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='de.openfront.replaycoach'" "$RUNNER_TEMP/apk-badging.txt"
          echo "Permanent release APK built and signature verified. APK is not published by this validation workflow."
